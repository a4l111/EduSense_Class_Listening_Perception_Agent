syntax = "proto3";

package thesis;

option java_package = "com.thesis.pipeline.grpc";
option java_multiple_files = true;

message PipelineRequest {
  bytes jpeg_frame = 1;
  int32 frame_index = 2;
  string dag_id = 3;
  float deadline_ms = 4;
  string device_id = 5;
}

message PipelineResponse {
  repeated Detection detections = 1;
  repeated TrackInfo tracks = 2;
  float detect_ms = 3;
  float track_ms = 4;
  float reid_ms = 5;
  float pose_ms = 6;
  float total_ms = 7;
  string detect_on = 8;
  string reid_on = 9;
  string pose_on = 10;
  float decode_ms = 11;
  float detect_preprocess_ms = 12;
  float detect_infer_ms = 13;
  float detect_postprocess_ms = 14;
  float reid_preprocess_ms = 15;
  float reid_infer_ms = 16;
  float queue_wait_ms = 17;
  int32 active_requests = 18;
  string education_json = 19;
}

message DetectRequest {
  bytes jpeg_frame = 1;
  int32 frame_index = 2;
}

message DetectResponse {
  repeated Detection detections = 1;
  float latency_ms = 2;
  string processor = 3;
}

message ReIDRequest {
  repeated bytes track_crops = 1;
  int32 frame_index = 2;
}

message ReIDResponse {
  repeated bytes embeddings = 1;
  float latency_ms = 2;
  string processor = 3;
}

message Detection {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  float confidence = 5;
  int32 class_id = 6;
}

message TrackInfo {
  int32 track_id = 1;
  float x1 = 2;
  float y1 = 3;
  float x2 = 4;
  float y2 = 5;
}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  float gpu_utilization = 2;
  float cpu_utilization = 3;
  int32 queue_length = 4;
  int32 active_requests = 5;
  float avg_latency_ms = 6;
}

service InferenceService {
  rpc RunPipelineA(PipelineRequest) returns (PipelineResponse);
  rpc RunDetect(DetectRequest) returns (DetectResponse);
  rpc RunReID(ReIDRequest) returns (ReIDResponse);
  rpc GetNodeStatus(StatusRequest) returns (StatusResponse);
}
